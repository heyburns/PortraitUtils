[project]
name = "portraitutils"
description = "ComfyUI tools for real-photo editing and restoration: protected cropping, editor-ready sizing, typed configuration, color correction, compositing, and image I/O."
version = "2.0.0"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["comfyui", "photography", "image-editing", "restoration"]

# Keep these in sync with requirements.txt. ComfyUI supplies PyTorch.
dependencies = [
    "numpy>=1.25.0",
    "Pillow>=9.1.0",
    "opencv-python-headless>=4.10.0.84",
    "tifffile",
]

[project.urls]
Repository = "https://github.com/heyburns/PortraitUtils"
Documentation = "https://github.com/heyburns/PortraitUtils#readme"
"Bug Tracker" = "https://github.com/heyburns/PortraitUtils/issues"

[tool.comfy]
PublisherId = "heyburns"
DisplayName = "PortraitUtils"
Icon = ""
includes = []
